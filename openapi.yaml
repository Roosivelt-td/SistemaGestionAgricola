      summary: Crear nuevo comprador
      description: Crea un nuevo perfil de comprador
      security:
        - Bearer: []
      requestBody:
        description: Datos del nuevo comprador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompradorDTO'
        required: true
      responses:
        '201':
          description: Comprador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorDTO'
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
        '403':
          description: Acceso prohibido
  /api/Terrenos:
    get:
      tags:
        - Terrenos
      summary: Obtener todos los terrenos
      description: Obtiene una lista de todos los terrenos (requiere autenticación)
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de terrenos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerrenoDTO'
        '401':
          description: No autorizado
    post:
      tags:
        - Terrenos
      summary: Crear nuevo terreno
      description: Crea un nuevo terreno
      security:
        - Bearer: []
      requestBody:
        description: Datos del nuevo terreno
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerrenoDTO'
        required: true
      responses:
        '201':
          description: Terreno creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerrenoDTO'
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
        '403':
          description: Acceso prohibido
  /api/Cultivos:
    get:
      tags:
        - Cultivos
      summary: Obtener todos los cultivos
      description: Obtiene una lista de todos los cultivos
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de cultivos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CultivoDTO'
        '401':
          description: No autorizado
    post:
      tags:
        - Cultivos
      summary: Crear nuevo cultivo
      description: Crea un nuevo cultivo
      security:
        - Bearer: []
      requestBody:
        description: Datos del nuevo cultivo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCultivoDTO'
        required: true
      responses:
        '201':
          description: Cultivo creado exitosamente
          content:
            application/json:
              schema:
