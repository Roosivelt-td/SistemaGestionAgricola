    post:
      tags:
        - Ventas
      summary: Crear nueva venta
      description: Crea una nueva venta
      security:
        - Bearer: []
      requestBody:
        description: Datos de la nueva venta
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVentaDTO'
        required: true
      responses:
        '201':
          description: Venta creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaDTO'
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingresa el token JWT. Ejemplo: Bearer eyJhbGciOi...
  schemas:
    AgricultorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        usuarioId:
          type: integer
          format: int32
          example: 1
        dni:
          type: string
          example: "12345678A"
        direccion:
          type: string
          example: "Calle Principal 123"
        experiencia:
          type: string
          example: "5 años"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        usuarioNombre:
          type: string
          example: "Juan Pérez"
        usuarioEmail:
          type: string
          format: email
          example: "juan.perez@example.com"
        usuarioTelefono:
          type: string
          example: "+1234567890"
    CreateAgricultorDTO:
      type: object
      properties:
        usuarioId:
          type: integer
          format: int32
          example: 1
        dni:
          type: string
          example: "12345678A"
        direccion:
          type: string
          example: "Calle Principal 123"
        experiencia:
          type: string
          example: "5 años"
      required:
        - usuarioId
        - dni
    UpdateAgricultorDTO:
      type: object
      properties:
        dni:
          type: string
          example: "12345678A"
        direccion:
          type: string
          example: "Calle Principal 123"
        experiencia:
          type: string
          example: "5 años"
    CompradorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        usuarioId:
          type: integer
          format: int32
          example: 1
        empresa:
          type: string
          example: "Empresa ABC"
        direccion:
          type: string
          example: "Calle Comprador 456"
        ruc:
          type: string
          example: "20123456789"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        usuarioNombre:
          type: string
          example: "María López"
        usuarioEmail:
          type: string
          format: email
          example: "maria.lopez@example.com"
        usuarioTelefono:
          type: string
          example: "+0987654321"
    CreateCompradorDTO:
      type: object
      properties:
        usuarioId:
          type: integer
          format: int32
          example: 1
        empresa:
          type: string
          example: "Empresa ABC"
        direccion:
          type: string
          example: "Calle Comprador 456"
        ruc:
          type: string
          example: "20123456789"
      required:
        - usuarioId
    TerrenoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        agricultorId:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: "Finca El Paraíso"
        ubicacion:
          type: string
          example: "Calle Terreno 789"
        area:
          type: number
          format: double
          example: 10.5
        descripcion:
          type: string
          example: "Terreno fértil ideal para cultivos"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        agricultorNombre:
          type: string
          example: "Juan Pérez"
    CreateTerrenoDTO:
      type: object
      properties:
        agricultorId:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: "Finca El Paraíso"
        ubicacion:
          type: string
          example: "Calle Terreno 789"
        area:
          type: number
          format: double
          example: 10.5
        descripcion:
          type: string
          example: "Terreno fértil ideal para cultivos"
      required:
        - agricultorId
        - nombre
        - ubicacion
        - area
    CultivoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        terrenoId:
          type: integer
          format: int32
          example: 1
        tipoCultivoId:
          type: integer
          format: int32
          example: 1
        fechaSiembra:
          type: string
          format: date
          example: "2023-03-15"
        estado:
          type: string
          example: "activo"
        observaciones:
          type: string
          example: "Cuidados especiales"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        nombreTerreno:
          type: string
          example: "Finca El Paraíso"
        nombreTipoCultivo:
          type: string
          example: "Maíz"
    CreateCultivoDTO:
      type: object
      properties:
        terrenoId:
          type: integer
          format: int32
          example: 1
        tipoCultivoId:
          type: integer
          format: int32
          example: 1
        fechaSiembra:
          type: string
          format: date
          example: "2023-03-15"
        estado:
          type: string
          example: "activo"
        observaciones:
          type: string
          example: "Cuidados especiales"
      required:
        - terrenoId
        - tipoCultivoId
        - fechaSiembra
    CosechaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        cultivoId:
          type: integer
          format: int32
          example: 1
        fechaCosecha:
          type: string
          format: date
          example: "2023-07-20"
        cantidad:
          type: number
          format: double
          example: 500.0
        unidad:
          type: string
          example: "kg"
        calidad:
          type: string
          example: "buena"
        observaciones:
          type: string
          example: "Buena calidad general"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        nombreCultivo:
          type: string
          example: "Maíz"
    CreateCosechaDTO:
      type: object
      properties:
        cultivoId:
          type: integer
          format: int32
          example: 1
        fechaCosecha:
          type: string
          format: date
          example: "2023-07-20"
        cantidad:
          type: number
          format: double
          example: 500.0
        unidad:
          type: string
          example: "kg"
        calidad:
          type: string
          example: "buena"
        observaciones:
          type: string
          example: "Buena calidad general"
      required:
        - cultivoId
        - fechaCosecha
        - cantidad
        - unidad
    VentaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        compradorId:
          type: integer
          format: int32
          example: 1
        cosechaId:
          type: integer
          format: int32
          example: 1
        fechaVenta:
          type: string
          format: date
          example: "2023-08-01"
        cantidad:
          type: number
          format: double
          example: 100.0
        precioUnitario:
          type: number
          format: double
          example: 2.5
        total:
          type: number
          format: double
          example: 250.0
        estado:
          type: string
          example: "completada"
        metodoPago:
          type: string
          example: "efectivo"
        observaciones:
          type: string
          example: "Pago completo"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        nombreComprador:
          type: string
          example: "María López"
        nombreCosecha:
          type: string
          example: "Maíz"
    CreateVentaDTO:
      type: object
      properties:
        compradorId:
          type: integer
          format: int32
          example: 1
        cosechaId:
          type: integer
          format: int32
          example: 1
        fechaVenta:
          type: string
          format: date
          example: "2023-08-01"
        cantidad:
          type: number
          format: double
          example: 100.0
        precioUnitario:
          type: number
          format: double
          example: 2.5
        estado:
          type: string
          example: "completada"
        metodoPago:
          type: string
          example: "efectivo"
        observaciones:
          type: string
          example: "Pago completo"
      required:
        - compradorId
        - cosechaId
        - fechaVenta
        - cantidad
        - precioUnitario