openapi: 3.0.1
info:
  title: Sistema Gestión Agrícola API
  description: API para el sistema de gestión agrícola
  version: v1
  contact:
    name: Soporte
    email: soporte@sistemaagricola.com
servers:
  - url: http://localhost:5173
    description: Servidor local de desarrollo
  - url: https://tu-servidor-produccion.com
    description: Servidor de producción
paths:
  /api/Auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Permite a un usuario iniciar sesión y obtener un token JWT
      requestBody:
        description: Credenciales de inicio de sesión
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@example.com
                password:
                  type: string
                  format: password
                  example: contraseña123
              required:
                - email
                - password
        required: true
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "refreshtoken123..."
                      expiresIn:
                        type: integer
                        example: 1800
                  message:
                    type: string
                    example: "Inicio de sesión exitoso"
        '400':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Credenciales inválidas"
        '401':
          description: Cuenta desactivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "La cuenta está desactivada"
  /api/Auth/register:
    post:
      tags:
        - Auth
      summary: Registrar nuevo usuario
      description: Registra un nuevo usuario en el sistema
      requestBody:
        description: Datos de registro
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan Pérez"
                email:
                  type: string
                  format: email
                  example: "juan.perez@example.com"
                telefono:
                  type: string
                  example: "+1234567890"
                password:
                  type: string
                  format: password
                  example: "contraseña123"
                confirmPassword:
                  type: string
                  format: password
                  example: "contraseña123"
                rol:
                  type: string
                  enum: ["admin", "comprador", "agricultor"]
                  example: "agricultor"
              required:
                - nombre
                - email
                - password
                - confirmPassword
                - rol
        required: true
      responses:
        '200':
          description: Registro exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuario registrado exitosamente"
        '400':
          description: Datos de registro inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["El correo electrónico ya está registrado"]
  /api/Agricultores:
    get:
      tags:
        - Agricultores
      summary: Obtener todos los agricultores
      description: Obtiene una lista de todos los agricultores (requiere rol admin)
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de agricultores obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgricultorDTO'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No autorizado"
        '403':
          description: Acceso prohibido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Acceso denegado. Se requiere rol admin"
    post:
      tags:
        - Agricultores
      summary: Crear nuevo agricultor
      description: Crea un nuevo perfil de agricultor
      security:
        - Bearer: []
      requestBody:
        description: Datos del nuevo agricultor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgricultorDTO'
        required: true
      responses:
        '201':
          description: Agricultor creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgricultorDTO'
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
        '403':
          description: Acceso prohibido
  /api/Agricultores/{id}:
    get:
      tags:
        - Agricultores
      summary: Obtener agricultor por ID
      description: Obtiene un agricultor específico por su ID
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            example: 1
      responses:
        '200':
          description: Agricultor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgricultorDTO'
        '404':
          description: Agricultor no encontrado
    put:
      tags:
        - Agricultores
      summary: Actualizar agricultor
      description: Actualiza un agricultor existente
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            example: 1
      requestBody:
        description: Datos para actualizar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgricultorDTO'
        required: true
      responses:
        '204':
          description: Agricultor actualizado exitosamente
        '400':
          description: Datos inválidos
        '401':
          description: No autorizado
        '403':
          description: Acceso prohibido
        '404':
          description: Agricultor no encontrado
    delete:
      tags:
        - Agricultores
      summary: Eliminar agricultor
      description: Elimina un agricultor (requiere rol admin)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            example: 1
      responses:
        '204':
          description: Agricultor eliminado exitosamente
        '401':
          description: No autorizado
        '403':
          description: Acceso prohibido
        '404':
          description: Agricultor no encontrado
  /api/Compradores:
    get:
      tags:
