  /api/Cosechas:
    get:
      tags:
        - Cosechas
      summary: Obtener todas las cosechas
      description: Obtiene una lista de todas las cosechas
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de cosechas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CosechaDTO'
        '401':
          description: No autorizado
    post:
      tags:
        - Cosechas
      summary: Crear nueva cosecha
      description: Crea una nueva cosecha
      security:
        - Bearer: []
      requestBody:
        description: Datos de la nueva cosecha
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCosechaDTO'
        required: true
      responses:
        '201':
          description: Cosecha creada exitosamente
          content:
